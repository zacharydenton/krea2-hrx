[workspace]
resolver = "2"
members = ["cli", "crates/hrx", "crates/loom", "crates/tokenizer", "crates/numerics", "crates/checkpoint", "crates/session", "crates/abi", "crates/ops", "crates/models", "crates/pipeline"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
strip = true

[workspace.dependencies]
hrx-core = { package = "hrx", git = "https://github.com/zacharydenton/hrx.rs", rev = "be89b44652af6adf17c5c950d0759f92c2e88582", default-features = false, features = ["compat", "download", "ffi", "loom"] }
