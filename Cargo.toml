[package]
name = "krea2-hrx"
version = "0.1.0"
edition = "2021"
description = "Krea 2 image generation on AMD Strix Halo, powered by Loom kernels and HRX"
readme = "README.md"
repository = "https://github.com/zacharydenton/krea2-hrx"
keywords = ["krea", "image-generation", "amd", "loom", "hrx"]
categories = ["command-line-utilities", "multimedia::images", "science"]
license = "MIT AND (Apache-2.0 WITH LLVM-exception)"
publish = false

# Keep the CLI and Rust imports stable under the repository/package name.
[lib]
name = "krea2"

[[bin]]
name = "krea2"
path = "src/main.rs"

[profile.release]
strip = true

[features]
default = ["npu"]
npu = ["hrx/npu-compile"]

[dependencies]
hrx = { package = "hrx-rs", version = "0.5.0", default-features = false, features = ["download", "loom"] }

tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
png = "0.17"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
# default-features = false keeps this pure Rust: fancy-regex instead of the
# oniguruma C library, and no progress bars or HTTP.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"

[dev-dependencies]
# An independent implementation of the same rounding, for the oracle tests only.
half = { version = "2", features = ["bytemuck"] }

[[example]]
name = "fusion_worker"
required-features = ["npu"]
