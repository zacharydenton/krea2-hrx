[package]
name = "krea2"
version = "0.1.0"
edition = "2021"
description = "Krea 2 image generation on one Radeon 8060S, through HRX and Loom"
license = "MIT AND (Apache-2.0 WITH LLVM-exception)"
publish = false

[profile.release]
strip = true

[features]
default = ["npu"]
npu = ["hrx/npu-compile"]

[dependencies]
hrx = { package = "hrx-rs", git = "https://github.com/zacharydenton/hrx-rs", rev = "6f5979fa3f0956e7390bb4de125dfef18857210b", default-features = false, features = ["download", "loom"] }

tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
memmap2 = "0.9"
png = "0.17"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
safetensors = "0.8"
# default-features = false keeps this pure Rust: fancy-regex instead of the
# oniguruma C library, and no progress bars or HTTP.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"

[dev-dependencies]
# An independent implementation of the same rounding, for the oracle tests only.
half = { version = "2", features = ["bytemuck"] }

[[example]]
name = "fusion_worker"
required-features = ["npu"]
