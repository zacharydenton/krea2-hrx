[workspace]
resolver = "2"
members = ["cli", "crates/kernels", "crates/tokenizer", "crates/numerics", "crates/checkpoint", "crates/session", "crates/ops", "crates/models", "crates/pipeline"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
strip = true

[workspace.dependencies]
# 0.2.0 is not on crates.io yet, so this pins the revision rather than the
# version. Move back to a plain registry dependency once it is published.
hrx = { package = "hrx-rs", git = "https://github.com/zacharydenton/hrx-rs", rev = "f1b62a9", default-features = false, features = ["download", "loom"] }
