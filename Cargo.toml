[workspace]
resolver = "2"
members = ["cli", "crates/kernels", "crates/tokenizer", "crates/numerics", "crates/checkpoint", "crates/session", "crates/ops", "crates/models", "crates/pipeline"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
strip = true

[workspace.dependencies]
hrx = { package = "hrx-rs", version = "0.1.0", default-features = false, features = ["download", "loom"] }
