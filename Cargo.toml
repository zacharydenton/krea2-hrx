[package]
name = "krea2-hrx"
version = "0.1.0"
edition = "2024"
# hrx-rs 0.8 requires 1.91.
rust-version = "1.91"
description = "Krea 2 image generation on AMD Strix Halo, powered by Loom kernels and HRX"
readme = "README.md"
repository = "https://github.com/zacharydenton/krea2-hrx"
keywords = ["krea", "image-generation", "amd", "loom", "hrx"]
categories = ["command-line-utilities", "multimedia::images", "science"]
license = "MIT AND (Apache-2.0 WITH LLVM-exception)"
publish = false

# Keep the CLI and Rust imports stable under the repository/package name.
[lib]
name = "krea2"

[[bin]]
name = "krea2"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
# Cross-crate inlining for the host-side conversion and tokenization loops.
lto = "thin"

[features]
default = []
# Native Loom/XDNA text-fusion experiment; automatic selection remains GPU.
npu = ["hrx/npu", "dep:serde", "dep:tempfile"]

[dependencies]
hrx = { package = "hrx-rs", version = "0.8.11" }

# The CLI's error reporting, and the npu input capture's.
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
png = "0.17"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde_json = "1"
thiserror = "2"
# default-features = false keeps this pure Rust: fancy-regex instead of the
# oniguruma C library, and no progress bars or HTTP.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# The npu feature's capture files and shape metadata.
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
# An independent implementation of the same rounding, for the oracle tests only.
half = { version = "2", features = ["bytemuck"] }
tempfile = "3"
unicode-normalization = "0.1"

[[example]]
name = "fusion_npu"
required-features = ["npu"]
