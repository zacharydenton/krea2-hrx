[package]
name = "krea2-tokenizer"
version = "0.1.0"
edition = "2021"
description = "Qwen3-VL's tokenizer and Krea 2's prompt template"
license = "MIT"
publish = false

[lib]
name = "krea2_tokenizer"

[dependencies]
# default-features = false keeps this pure Rust: fancy-regex instead of the
# oniguruma C library, and no progress bars or HTTP.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"

