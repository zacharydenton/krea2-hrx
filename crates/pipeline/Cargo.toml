[package]
name = "krea2-pipeline"
version = "0.1.0"
edition = "2021"
description = "Krea 2 end to end: prompt in, RGB out"
license = "MIT"
publish = false

[lib]
name = "krea2_pipeline"

[dependencies]
hrx.workspace = true
krea2-models = { path = "../models" }
krea2-numerics = { path = "../numerics" }
krea2-ops = { path = "../ops" }
krea2-session = { path = "../session" }
krea2-kernels = { path = "../kernels" }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"

[dev-dependencies]
serde_json = "1"
png = "0.17"
tempfile = "3"
