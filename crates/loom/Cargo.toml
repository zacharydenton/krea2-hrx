[package]
name = "loom"
version = "0.1.0"
edition = "2021"
description = "Compiling and caching Loom kernels for gfx1151"
license = "MIT"
publish = false

[dependencies]
hrx = { package = "krea2-hrx", path = "../hrx" }

[dev-dependencies]
hrx-core.workspace = true
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
