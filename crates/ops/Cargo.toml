[package]
name = "krea2-ops"
version = "0.1.0"
edition = "2021"
description = "The auxiliary Loom operations the pipeline is built from"
license = "MIT"
publish = false

[lib]
name = "krea2_ops"

[dependencies]
hrx.workspace = true
# Reinterpreting bf16 element slices as bytes for the runtime's transfers,
# which take &[u8] rather than a Pod element type.
bytemuck = "1"
krea2-numerics = { path = "../numerics" }
krea2-kernels = { path = "../kernels" }
