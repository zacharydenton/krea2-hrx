[package]
name = "krea2-models"
version = "0.1.0"
edition = "2021"
description = "ComfyUI's text encoder and VAE, and the graph around the blocks"
license = "MIT"
publish = false

[lib]
name = "krea2_models"

[dependencies]
bytemuck = "1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
hrx = { path = "../hrx" }
krea2-checkpoint = { path = "../checkpoint" }
krea2-numerics = { path = "../numerics" }
krea2-ops = { path = "../ops" }
krea2-tokenizer = { path = "../tokenizer" }
