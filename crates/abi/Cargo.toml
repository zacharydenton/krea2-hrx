[package]
name = "krea2-abi"
version = "0.1.0"
edition = "2021"
description = "libkrea2.so: the block session and the pipeline behind their C ABIs"
license = "MIT"
publish = false

[lib]
name = "krea2"
crate-type = ["cdylib"]

[dependencies]
hrx = { package = "krea2-hrx", path = "../hrx" }
krea2-pipeline = { path = "../pipeline" }
krea2-session = { path = "../session" }

[build-dependencies]
cbindgen = "0.29.4"
