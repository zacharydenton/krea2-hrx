[package]
name = "krea2"
version = "0.1.0"
edition = "2021"
description = "Prompt to image on the Radeon 8060S"
license = "MIT"
publish = false

[[bin]]
name = "krea2"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
krea2-pipeline = { path = "../crates/pipeline" }
png = "0.17"
